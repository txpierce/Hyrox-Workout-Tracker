<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TX\\\_Pierce HYROX Training App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hyrox: {
                            yellow: '#FFCC00',
                            dark: '#121212',
                            card: '#1E1E1E',
                            border: '#2D2D2D',
                            hover: '#333333'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #121212; 
            color: #E5E7EB; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            padding-bottom: 90px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input\\\[type="date"], input\\\[type="text"], input\\\[type="number"], select, textarea {
            background-color: #1E1E1E; border: 1px solid #374151; color: #F3F4F6;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #FFCC00; outline: none; ring: 2px; ring-color: #FFCC00;
        }
        .set-checkbox:checked + span {
            background-color: #FFCC00; color: #000; border-color: #FFCC00; font-weight: 800;
        }
        #floating-rest-dock {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 -4px 20px rgba(255, 204, 0, 0.2); }
            50% { box-shadow: 0 -4px 30px rgba(255, 204, 0, 0.5); }
        }
        .timer-active-glow {
            animation: pulse-glow 2s infinite;
            border-top: 2px solid #FFCC00 !important;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">
    <!-- Top Navigation Header -->
<header class="sticky top-0 z-40 bg-\\\[#121212]/95 backdrop-blur-md border-b border-hyrox-border px-4 py-3">
<div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
<div class="flex items-center justify-between w-full sm:w-auto">
<div class="flex items-center gap-3">
<div class="bg-hyrox-yellow text-black font-black text-xl px-2.5 py-1 rounded tracking-tighter uppercase italic">
HYROX
</div>
<div>
<h1 class="font-extrabold text-sm sm:text-base tracking-tight text-white leading-none">TX\_PIERCE</h1>
<p class="text-\\\[10px] text-gray-400 font-medium tracking-wide">PERFORMANCE TRAINING APP</p>
</div>
</div>
                <button onclick="openProfileModal()" class="flex items-center gap-1.5 bg-hyrox-yellow/10 border border-hyrox-yellow/30 hover:bg-hyrox-yellow/20 text-hyrox-yellow px-2.5 py-1 rounded-lg text-xs font-bold transition ml-2">
<i class="fa-solid fa-user-gear">
<span id="header-athlete-name">Athlete Profile</span>
</button>
</div>
            <div class="flex items-center gap-1.5 bg-hyrox-card p-1 rounded-lg border border-hyrox-border text-xs overflow-x-auto w-full sm:w-auto scrollbar-none">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition bg-hyrox-yellow text-black whitespace-nowrap">Dashboard</button>
                <button onclick="switchTab('program')" id="btn-program" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap">Program</button>
                <button onclick="switchTab('logger')" id="btn-logger" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap">Race Simulator</button>
                <button onclick="switchTab('nutrition')" id="btn-nutrition" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap"><i class="fa-solid fa-apple-whole mr-1"></i>Nutrition</button>
                <button onclick="switchTab('wellness')" id="btn-wellness" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap"><i class="fa-solid fa-heart-pulse mr-1"></i>Wellness</button>
                <button onclick="switchTab('tools')" id="btn-tools" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap">Live Timer</button>
                <button onclick="switchTab('cards')" id="btn-cards" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap">Share Cards</button>
                <button onclick="switchTab('raceprep')" id="btn-raceprep" class="tab-btn px-2.5 py-1.5 rounded font-semibold transition text-gray-300 hover:bg-gray-800 whitespace-nowrap">Race Prep</button>
            </div>
        </div>
    </header>

    <!-- App Content Loaded -->



</body>
</html>
